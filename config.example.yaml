# Copie para config.yaml e ajuste.
host: 0.0.0.0
porta: 8000
banco: data/camaras.db
capturas: data/capturas

alpr:
  ativo: true
  detector_model: yolo-v9-t-384-license-plate-end2end   # ou yolo-v9-t-640-license-plate-end2end (mais lento, enxerga placas menores)
  ocr_model: cct-s-v2-global-model
  confianca_deteccao: 0.4
  confianca_ocr: 0.6
  janela_duplicata_s: 120

autoseguro:
  ativo: true
  modo: assistido        # assistido (navegador visível, operador resolve captcha) | manual (só link)
  automatico: false      # true = consulta toda placa nova detectada
  headless: false
  intervalo_min_s: 15
  cache_horas: 24
  timeout_captcha_s: 180
  # Os seletores padrão já apontam para o formulário "Por placa patente" do site
  # (#txt_placa_patente, #btnPpuClick, reCAPTCHA). Só sobrescreva se o site mudar:
  # seletores:
  #   campo_placa: "#txt_placa_patente"
  #   botao_buscar: "#btnPpuClick"

# Lista real do portalimo.cl (Municipalidad de Osorno), gerada em 10/2026 com:
#   python -m camaras descobrir http://www.portalimo.cl/
# Todas são snapshots JPEG servidos por HTTP sem TLS. A "Plaza de Armas" fica em
# 190.121.3.148 e as demais em 216.155.78.8 (uma porta por câmera).
# tipo: snapshot (URL devolve um JPEG) | stream (MJPEG/HLS/RTSP) | pagina (página HTML que contém a câmera)
